<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TaxAce Community Board</title>
<style>
:root{
  --hp:#2b2d3a;--ac:#009dae;--ach:#007a87;--ac2:#7cb33f;
  --bg:#eef2f5;--sf:#f7f9fb;--cd:#fff;
  --tx:#1a2030;--sb:#556070;--ln:#dde4ed;
  --bn:linear-gradient(120deg,#2b2d3a,#1a4050,#009dae);
  --sh:rgba(0,100,120,.08);--lf:rgba(0,100,120,.14);
  --r:14px;--rs:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hp);z-index:200;transition:background .5s}
img,video{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}

/* Floating deco layer */
#deco-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.df{position:absolute;bottom:-60px;font-size:1.4em;animation:floatUp linear infinite;user-select:none}
@keyframes floatUp{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-115vh) rotate(720deg)}}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0);z-index:100;
  background:var(--hp);color:#fff;height:58px;padding:0 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 14px rgba(0,0,0,.4);transition:background .5s}
.hdr-logo{display:flex;align-items:center;flex-shrink:0;background:#fff;border-radius:10px;padding:4px 10px;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.hdr-logo img{display:block;height:36px;width:auto}
.hdr-info{flex:1}
.hdr-t{font-weight:700;font-size:15px;letter-spacing:-.2px}
.hdr-s{font-size:10px;opacity:.55;letter-spacing:.5px;text-transform:uppercase}
.mnav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:20px;padding:3px 5px}
.mn-b{background:none;border:none;color:#fff;width:24px;height:24px;border-radius:50%;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.mn-b:hover{background:rgba(255,255,255,.2)}
#mo-lbl{font-size:13px;font-weight:600;min-width:126px;text-align:center}
.pres{display:flex;align-items:center;margin-left:4px}

/* Theme strip */
.tstrip{
  background:var(--ac);color:#fff;
  padding:7px 20px;font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;
  transition:background .5s;position:relative;z-index:90;
  letter-spacing:.2px;
}
.tstrip-em{font-size:16px;letter-spacing:2px}
.tstrip-msg{opacity:.92}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:18px 14px;display:flex;gap:16px;align-items:flex-start;position:relative;z-index:1}
.sidebar{width:258px;flex-shrink:0;position:sticky;top:96px;display:flex;flex-direction:column;gap:14px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--cd);border-radius:var(--r);box-shadow:0 1px 4px var(--sh),0 4px 16px var(--sh);transition:background .5s,box-shadow .5s}

/* Profile */
.pc{padding:20px;display:flex;flex-direction:column;align-items:center;gap:11px;text-align:center}
.pf-av{width:56px;height:56px;border-radius:50%;color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.pf-nm{font-weight:700;font-size:15px}
.pf-ro{font-size:11px;color:var(--sb)}
.pf-in{width:100%;border:1.5px solid var(--ln);border-radius:var(--rs);padding:7px 12px;font-size:13px;text-align:center;background:var(--sf);color:var(--tx);transition:border-color .2s,background .5s,color .5s;font-family:inherit}
.pf-in:focus{outline:none;border-color:var(--ac)}
.pf-sv{background:var(--ac);color:#fff;border:none;border-radius:var(--rs);padding:7px 18px;font-size:13px;font-weight:600;transition:background .2s;width:100%}
.pf-sv:hover{background:var(--ach)}

/* Events */
.ec{padding:16px 18px}
.ev-s{margin-bottom:14px}.ev-s:last-child{margin-bottom:0}
.ev-h{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--sb);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--ln)}
.ev-it{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;padding:4px 0}
.ev-d{font-size:10px;font-weight:700;color:var(--ac);min-width:36px;flex-shrink:0;transition:color .5s}
.ev-n{font-size:12px;line-height:1.4}
.ev-no{font-size:12px;color:var(--sb);padding:4px 0}

/* Banner */
.banner{background:var(--bn);border-radius:var(--r);padding:22px 26px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 4px var(--sh),0 4px 16px var(--sh);overflow:hidden;position:relative;transition:background .5s}
.banner::before{content:"";position:absolute;right:-20px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.banner::after{content:"";position:absolute;right:35px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.04)}
.bn-txt{position:relative;z-index:1}
.bn-txt h2{font-size:21px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.1}
.bn-txt p{font-size:12px;color:rgba(255,255,255,.65);margin-top:5px}
.bn-flags{font-size:30px;position:relative;z-index:1;letter-spacing:2px}

/* Creator */
.creator{padding:18px}
.cr-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.c-av{width:36px;height:36px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.post-ta{flex:1;border:1.5px solid var(--ln);border-radius:var(--rs);padding:10px 14px;font-size:14px;resize:vertical;min-height:74px;background:var(--sf);color:var(--tx);font-family:inherit;transition:border-color .2s,background .5s,color .5s;line-height:1.55}
.post-ta:focus{outline:none;border-color:var(--ac)}
.post-ta::placeholder{color:var(--sb)}

/* Drawing */
.draw-pn{margin-top:12px;display:none}
.draw-tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;padding:10px 12px;background:var(--sf);border-radius:var(--rs);border:1px solid var(--ln)}
.sws{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;flex-shrink:0}
.sw:hover{transform:scale(1.2)}.sw.on{border-color:var(--tx);transform:scale(1.15)}
.c-custom{position:relative;width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);overflow:hidden;cursor:pointer}
.c-custom input[type=color]{position:absolute;width:40px;height:40px;top:-8px;left:-8px;border:none;cursor:pointer;opacity:1;background:none}
.draw-sep{width:1px;height:24px;background:var(--ln);flex-shrink:0}
.sz-b{background:var(--sf);border:1.5px solid var(--ln);border-radius:6px;width:28px;height:28px;font-size:11px;font-weight:700;color:var(--sb);transition:border-color .15s,color .15s}
.sz-b.on,.sz-b:hover{border-color:var(--ac);color:var(--ac)}
.da{background:var(--sf);border:1.5px solid var(--ln);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--sb);transition:border-color .15s,color .15s,background .15s}
.da:hover,.da.on{border-color:var(--ac);color:var(--ac);background:rgba(0,157,173,.07)}
#draw-cv{width:100%;border:1.5px solid var(--ln);border-radius:10px;cursor:crosshair;background:#fff;touch-action:none;display:block}

/* Media preview */
.med-pr{margin-top:10px;position:relative;display:none;border-radius:10px;overflow:hidden;background:var(--sf)}
.med-pr img,.med-pr video{width:100%;max-height:220px;object-fit:cover}
.rm-m{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:13px;display:flex;align-items:center;justify-content:center}
.rm-m:hover{background:rgba(0,0,0,.75)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.tb{background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--rs);padding:6px 11px;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:5px;transition:border-color .2s,color .2s,background .5s}
.tb:hover{border-color:var(--ac);color:var(--ac)}
.tb.on{border-color:var(--ac);color:var(--ac);background:rgba(0,157,173,.08)}
.post-btn{margin-left:auto;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);padding:8px 22px;font-size:14px;font-weight:600;transition:background .2s,transform .1s;letter-spacing:-.2px}
.post-btn:hover{background:var(--ach);transform:translateY(-1px)}
.post-btn:active{transform:none}
.post-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Post card */
.post-card{background:var(--cd);border-radius:var(--r);box-shadow:0 1px 4px var(--sh),0 4px 16px var(--sh);border-left:3px solid transparent;overflow:hidden;transition:box-shadow .2s,background .5s}
.post-card:hover{box-shadow:0 2px 8px var(--lf),0 8px 28px var(--lf)}
.pi{padding:16px 18px}
.p-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.p-av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.p-meta{flex:1;min-width:0}
.p-who{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-ts{font-size:11px;color:var(--sb);margin-top:1px}
.p-ed{font-size:10px;color:var(--ac);margin-left:4px;font-style:italic}
.p-acts{display:flex;gap:4px}
.p-edb{background:none;border:none;color:var(--sb);font-size:14px;padding:3px 5px;border-radius:5px;transition:color .2s,background .15s}
.p-edb:hover{color:var(--ac);background:rgba(0,157,173,.1)}
.p-del{background:none;border:none;color:var(--sb);font-size:14px;padding:3px 5px;border-radius:5px;transition:color .2s}
.p-del:hover{color:#dc2626}
.p-cnt{font-size:14px;line-height:1.65;margin-bottom:11px;white-space:pre-wrap;word-break:break-word}
/* Edit area */
.p-ea{display:none;margin-bottom:11px}
.p-eta{width:100%;border:1.5px solid var(--ac);border-radius:var(--rs);padding:10px 14px;font-size:14px;resize:vertical;min-height:74px;background:var(--sf);color:var(--tx);font-family:inherit;line-height:1.55}
.p-eta:focus{outline:none}
.ea-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ea-c{background:var(--sf);border:1.5px solid var(--ln);border-radius:var(--rs);padding:6px 14px;font-size:13px;color:var(--sb);transition:border-color .15s}
.ea-c:hover{border-color:var(--ac);color:var(--ac)}
.ea-s{background:var(--ac);color:#fff;border:none;border-radius:var(--rs);padding:6px 18px;font-size:13px;font-weight:600;transition:background .2s}
.ea-s:hover{background:var(--ach)}

.p-med{margin-bottom:11px;background:var(--sf);overflow:hidden}
.p-med img,.p-med video{width:100%;max-height:360px;object-fit:cover}
.p-draw{margin-bottom:11px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--ln);background:#fff}
.p-draw img{width:100%}

/* Reactions */
.rxn-bar{display:flex;align-items:center;gap:5px;padding:9px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);flex-wrap:wrap;min-height:38px}
.rxn{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:3px 9px;font-size:13px;display:flex;align-items:center;gap:3px;transition:border-color .15s,background .15s;color:var(--tx)}
.rxn:hover,.rxn.me{border-color:var(--ac2);background:rgba(124,179,63,.12)}
.rxn-n{font-size:11px;font-weight:700}
.add-rxn{background:none;border:1.5px dashed var(--ln);border-radius:16px;padding:3px 9px;font-size:13px;color:var(--sb);transition:border-color .15s,color .15s}
.add-rxn:hover{border-color:var(--ac);color:var(--ac)}
.epick{position:fixed;z-index:400;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;width:186px;box-shadow:0 4px 24px rgba(0,0,0,.18);gap:2px}
.epick button{background:none;border:none;font-size:20px;padding:4px 5px;border-radius:6px;transition:background .12s}
.epick button:hover{background:var(--sf)}
.ov{position:fixed;inset:0;z-index:390}

/* Comments */
.cw{margin-top:10px}
.tc{background:none;border:none;color:var(--sb);font-size:12px;font-family:inherit;padding:3px 0;transition:color .2s}
.tc:hover{color:var(--ac)}
.ca{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.cmt{display:flex;gap:8px;align-items:flex-start}
.cm-av{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.cm-body{background:var(--sf);border-radius:10px;padding:7px 11px;flex:1;transition:background .5s}
.cm-who{font-weight:600;font-size:12px}
.cm-txt{font-size:13px;line-height:1.45;margin-top:1px;word-break:break-word}
.cm-ts{font-size:10px;color:var(--sb);margin-top:3px}
.cm-row{display:flex;gap:7px;align-items:flex-end;margin-top:6px}
.cm-in{flex:1;border:1.5px solid var(--ln);border-radius:14px;padding:6px 13px;font-size:13px;background:var(--sf);color:var(--tx);font-family:inherit;resize:none;min-height:32px;max-height:80px;transition:border-color .2s,background .5s,color .5s}
.cm-in:focus{outline:none;border-color:var(--ac)}
.cm-snd{background:var(--ac);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.cm-snd:hover{background:var(--ach)}

/* Misc */
.empty{text-align:center;padding:48px 20px;color:var(--sb);position:relative;z-index:1}
.em-ico{font-size:40px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:5px}
.empty p{font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--hp);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateY(60px);opacity:0;transition:transform .28s,opacity .28s,background .5s;z-index:500}
.toast.show{transform:translateY(0);opacity:1}
#file-in{display:none}

@media(max-width:700px){.hdr-logo{padding:3px 7px}.hdr-logo img{height:30px}.sidebar{display:none}.wrap{padding:10px}.hdr{padding:0 12px}.hdr-s{display:none}#mo-lbl{min-width:96px;font-size:12px}.banner{padding:16px 18px}.bn-txt h2{font-size:17px}}

/* ── Login / account / admin ── */
body.locked .wrap,body.locked .tstrip{visibility:hidden}
.hdr-me{position:relative;margin-left:4px;flex-shrink:0}
.hdr-av{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;transition:border-color .15s}
.hdr-av:hover{border-color:#fff}
.acct-menu{display:none;position:absolute;right:0;top:44px;min-width:220px;background:var(--cd);color:var(--tx);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:6px;z-index:300}
.acct-menu.open{display:block}
.am-who{padding:8px 10px 10px;border-bottom:1px solid var(--ln);margin-bottom:4px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.am-who span{font-size:11px;color:var(--sb);word-break:break-all}
.acct-menu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:13px}
.acct-menu button:hover{background:var(--sf)}
.pf-em{font-size:11px;color:var(--sb);word-break:break-all;margin-top:-6px}
.pf-sv.alt{background:var(--sf);color:var(--tx);border:1.5px solid var(--ln)}
.pf-sv.alt:hover{border-color:var(--ac);color:var(--ac);background:var(--sf)}

.auth-ov{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px 20px;overflow:auto}
.auth-card{width:100%;max-width:400px;margin:auto 0;background:var(--cd);color:var(--tx);border-radius:18px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-logo-wrap{display:flex;justify-content:center;margin-bottom:16px}

.auth-logo{display:block;height:52px;width:auto}
.auth-card h2{font-size:20px;font-weight:800;text-align:center;margin:0 0 6px;letter-spacing:-.2px}
.auth-sub{font-size:13px;color:var(--sb);text-align:center;line-height:1.5;margin-bottom:16px}
.auth-card label,.m-card label{display:block;font-size:12px;font-weight:600;color:var(--sb);margin:0 0 12px}
.auth-card input,.m-card input,.m-card select{display:block;width:100%;margin-top:5px;border:1.5px solid var(--ln);border-radius:var(--rs);padding:11px 12px;font-size:16px;background:var(--sf);color:var(--tx);font-family:inherit;transition:border-color .2s}
.auth-card input:focus,.m-card input:focus,.m-card select:focus{outline:none;border-color:var(--ac)}
.auth-btn{width:100%;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);padding:12px;font-size:15px;font-weight:700;margin-top:4px;transition:background .2s}
.auth-btn:hover{background:var(--ach)}.auth-btn:disabled{opacity:.6}
.auth-link{display:block;margin:14px auto 0;background:none;border:none;color:var(--sb);font-size:12px;text-decoration:underline}
.auth-err{min-height:18px;margin-top:10px;font-size:13px;color:#e5484d;text-align:center;line-height:1.4}
.auth-note{font-size:11px;color:var(--sb);text-align:center;margin-top:14px;line-height:1.5}
.qr-box{text-align:center;margin-bottom:14px;min-height:60px}
.qr-box img{display:block;margin:0 auto;width:200px;height:200px;border-radius:10px;background:#fff;padding:6px}
.qr-secret{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.5px;background:var(--sf);border:1px dashed var(--ln);border-radius:8px;padding:7px 8px;display:block;text-align:center;margin-top:8px;user-select:all}
.qr-hint{font-size:11px;color:var(--sb);margin-top:6px}
.auth-card input.code-in{text-align:center;letter-spacing:6px;font-size:22px;font-weight:700}

.modal-ov{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.m-card{width:100%;max-width:420px;margin:auto 0;background:var(--cd);color:var(--tx);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.m-card.wide{max-width:780px}
.m-card h3{font-size:17px;font-weight:800;margin-bottom:12px}
.m-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.m-btn{background:var(--ac);color:#fff;border:none;border-radius:var(--rs);padding:9px 16px;font-size:13px;font-weight:600;transition:background .2s}
.m-btn:hover{background:var(--ach)}
.m-btn.alt{background:var(--sf);color:var(--tx);border:1.5px solid var(--ln)}
.m-btn.alt:hover{border-color:var(--ac);color:var(--ac)}
.m-btn.sm{padding:5px 9px;font-size:11px}
.m-btn.danger{background:#e5484d;color:#fff}
.adm-add{display:grid;grid-template-columns:1fr 1.3fr auto auto;gap:8px;align-items:end;margin-bottom:6px}
.adm-add label{margin:0}
.adm-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.adm-it{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.adm-it.off{opacity:.55}
.adm-nm{font-weight:700;font-size:14px}
.adm-em{font-size:12px;color:var(--sb);word-break:break-all}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;margin:5px 4px 0 0;background:var(--sf);border:1px solid var(--ln);color:var(--sb)}
.badge.ok{color:#1d9a57;border-color:#1d9a57}.badge.warn{color:#d98a00;border-color:#d98a00}.badge.bad{color:#e5484d;border-color:#e5484d}
.adm-acts{display:flex;gap:6px;flex-wrap:wrap}
.starter{background:rgba(124,179,63,.14);border:1.5px solid var(--ac2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5}
.starter code{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;letter-spacing:1px;margin:6px 8px 6px 0;padding:4px 10px;background:var(--cd);border-radius:8px;border:1px solid var(--ln)}
@media(max-width:700px){.adm-add{grid-template-columns:1fr}.hdr-me{margin-left:0}}
@media(max-width:520px){.hdr-info{display:none}.hdr{gap:8px}.mnav{margin-left:auto}}

/* space between posts in the shared feed */
#feed{display:flex;flex-direction:column;gap:14px}

/* Profile photos */
#av-in{display:none}
.pf-av-wrap{position:relative;flex-shrink:0}
.pf-cam{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;border:2px solid var(--cd);background:var(--ac);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s}
.pf-cam:hover{background:var(--ach)}

/* Login screens: a fixed white theme that matches the TaxAce logo (they don't follow the monthly theme) */
.auth-ov{--cd:#ffffff;--tx:#2b2f36;--sb:#5f6b73;--ln:#d5dfde;--sf:#f4f8f8;--ac:#007F6D;--ach:#006B5C;
  background:radial-gradient(1100px 540px at 50% -10%,#dff4ef 0%,rgba(223,244,239,0) 70%),#ffffff}
.auth-card{border:1px solid #e1ebe9;box-shadow:0 12px 40px rgba(16,70,62,.10),0 2px 6px rgba(16,70,62,.06)}
.auth-card input:focus{border-color:#00A890;box-shadow:0 0 0 3px rgba(0,168,144,.18)}
.auth-card .auth-err{color:#c62828}

/* Flags drawn as pictures (Windows can't display flag emoji; it shows the letters "US"/"PH") */
.flag{display:inline-block;height:1em;border-radius:2px;background-size:100% 100%;background-repeat:no-repeat;vertical-align:-.14em;box-shadow:0 0 0 1px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.22)}

/* ── API ── */
async function api(path,opts){
  opts=opts||{};
  const o={method:opts.method||'GET',headers:{},credentials:'same-origin'};
  if(opts.body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opts.body)}
  let r;
  try{r=await fetch('/api/'+path,o)}catch(e){throw new Error('Cannot reach the server. Check your internet connection and try again.')}
  let data={};
  try{data=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status===401&&me)sessionEnded();
    const err=new Error(data.error||'Something went wrong. Please try again.');
    err.status=r.status;err.data=data;throw err;
  }
  return data;
}
function hasRxn(pid,em){const p=FEED.find(x=>x.id===pid);return !!(p&&p.mine&&p.mine.indexOf(em)>-1)}

/* Avatars: a photo when the person has one, otherwise their coloured initial. */
function avStyle(name,url){return url?'background:#8884 url('+esc(url)+') center/cover no-repeat':avSt(name)}
function avDiv(cls,name,url){return '<div class="'+cls+'" style="'+avStyle(name,url)+'">'+(url?'':esc(ini(name)))+'</div>'}
function setAv(el,name,url){el.textContent=url?'':ini(name);el.setAttribute('style',avStyle(name,url))}

/* Flags: shown as pictures, because Windows can't draw flag emoji. Returns safe HTML. */
const FLAG_RE=/(\u{1F1FA}\u{1F1F8}|\u{1F1F5}\u{1F1ED})/u;
function flagify(text){
  return String(text==null?'':text).split(FLAG_RE).map(part=>{
    if(part==='\u{1F1FA}\u{1F1F8}')return '<span class="flag flag-us" role="img" aria-label="US flag"></span>';
    if(part==='\u{1F1F5}\u{1F1ED}')return '<span class="flag flag-ph" role="img" aria-label="Philippine flag"></span>';
    return esc(part);
  }).join('');
}
/* Splits a string of emoji into whole symbols (keeps each flag together). */
function emojiList(str){
  if(typeof Intl!=='undefined'&&Intl.Segmenter)return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(str)].map(x=>x.segment).filter(x=>x.trim());
  return [...str];
}

/* ── HELPERS ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function avC(n){let h=0;for(const c of(n||'X'))h=(h*31+c.charCodeAt(0))&0xffffffff;return AVC[Math.abs(h)%AVC.length]}
function ini(n){return(n||'?').charAt(0).toUpperCase()}
function avSt(n){const c=avC(n);return'background:linear-gradient(135deg,'+c+','+c+'bb)'}
function mkKey(){return curYr+'-'+String(curMo+1).padStart(2,'0')}
function uid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function tAgo(ts){
  if(!ts)return'';const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
let toastT;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}

/* ── THEME ── */
function applyTheme(mo){
  const t=T[mo];const r=document.documentElement.style;
  r.setProperty('--hp',t.hp);r.setProperty('--ac',t.ac);r.setProperty('--ach',t.ach);
  r.setProperty('--ac2',t.ac2||t.ac);r.setProperty('--bg',t.bg);r.setProperty('--sf',t.sf);
  r.setProperty('--cd',t.cd);r.setProperty('--tx',t.tx);r.setProperty('--sb',t.sb);
  r.setProperty('--ln',t.ln);r.setProperty('--bn',t.bn);
  r.setProperty('--sh',t.dk?'rgba(0,0,0,.35)':'rgba(0,100,120,.08)');
  r.setProperty('--lf',t.dk?'rgba(0,0,0,.5)':'rgba(0,100,120,.14)');
  // Theme strip
  const ts=document.getElementById('tstrip');
  if(ts)ts.style.background=t.ac;
  document.getElementById('tstrip-em').innerHTML=flagify(t.icon);
  document.getElementById('tstrip-em2').innerHTML=flagify(t.icon);
  document.getElementById('tstrip-msg').textContent=t.msg;
  // Floating decos
  const layer=document.getElementById('deco-layer');layer.innerHTML='';
  const ems=emojiList(t.fl);
  for(let i=0;i<10;i++){
    const el=document.createElement('span');el.className='df';
    el.innerHTML=flagify(ems[i%ems.length]);
    const dur=5+Math.random()*9;
    el.style.cssText='left:'+(Math.random()*100)+'vw;animation-duration:'+dur+'s;animation-delay:'+(-Math.random()*dur)+'s;font-size:'+(1.1+Math.random()*1.2)+'em;opacity:'+(0.08+Math.random()*0.14);
    layer.appendChild(el);
  }
}

/* ── DRAWING ── */
function togDraw(){

  document.getElementById('draw-pn').style.display=drawOpen?'block':'none';

  if(drawOpen&&!cvInited)initCv();

function setCol(btn){drawCol=btn.dataset.c;drawErase=false;document.querySelectorAll('.sw').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('eraser-btn').classList.remove('on')}
function setCustCol(v){drawCol=v;drawErase=false;document.querySelectorAll('.sw').forEach(b=>b.classList.remove('on'));document.getElementById('eraser-btn').classList.remove('on')}
function setSz(s,btn){drawSz=s;document.querySelectorAll('.sz-b').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function togEraser(){drawErase=!drawErase;document.getElementById('eraser-btn').classList.toggle('on',drawErase)}
function clearCv(){const cv=document.getElementById('draw-cv');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);drawMade=false}
function initCv(){
  cvInited=true;const cv=document.getElementById('draw-cv');const ctx=cv.getContext('2d');
  ctx.lineCap='round';ctx.lineJoin='round';let lx,ly;
  function pos(e){const r=cv.getBoundingClientRect();const sx=cv.width/r.width,sy=cv.height/r.height;
    if(e.touches)return{x:(e.touches[0].clientX-r.left)*sx,y:(e.touches[0].clientY-r.top)*sy};
    return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}}
  function sd(e){e.preventDefault();isDrawing=true;const p=pos(e);lx=p.x;ly=p.y;ctx.beginPath();const sz=drawErase?drawSz*4:drawSz;ctx.arc(p.x,p.y,sz/2,0,Math.PI*2);ctx.fillStyle=drawErase?'#fff':drawCol;ctx.fill();drawMade=true}
  function md(e){if(!isDrawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.strokeStyle=drawErase?'#fff':drawCol;ctx.lineWidth=drawErase?drawSz*4:drawSz;ctx.stroke();lx=p.x;ly=p.y;drawMade=true}
  function ed(){isDrawing=false}
  cv.addEventListener('mousedown',sd);cv.addEventListener('mousemove',md);cv.addEventListener('mouseup',ed);cv.addEventListener('mouseleave',ed);
  cv.addEventListener('touchstart',sd,{passive:false});cv.addEventListener('touchmove',md,{passive:false});cv.addEventListener('touchend',ed);
}
function getDrawUrl(){
  if(!drawMade)return null;
  const cv=document.getElementById('draw-cv');
  const ex=document.createElement('canvas');ex.width=cv.width;ex.height=cv.height;
  const ec=ex.getContext('2d');ec.fillStyle='#fff';ec.fillRect(0,0,ex.width,ex.height);ec.drawImage(cv,0,0);
  // downscale for storage
  const sm=document.createElement('canvas');sm.width=500;sm.height=175;
  const sc=sm.getContext('2d');sc.fillStyle='#fff';sc.fillRect(0,0,500,175);sc.drawImage(ex,0,0,500,175);
  return sm.toDataURL('image/jpeg',0.65);
}

/* ── IMAGE RESIZE ── */
async function resizeImg(file){
  return new Promise(res=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;const mx=800,my=500;
      if(w>mx){h=h*mx/w;w=mx}if(h>my){w=w*my/h;h=my}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.72));URL.revokeObjectURL(url);
    };img.src=url;
  });
}
document.getElementById('file-in').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  const dataUrl=await resizeImg(f);pendingImg=dataUrl;
  const pre=document.getElementById('med-pr');
  document.getElementById('pre-img').src=dataUrl;document.getElementById('pre-img').style.display='block';
  pre.style.display='block';e.target.value='';
});
function rmMedia(){pendingImg=null;document.getElementById('med-pr').style.display='none';document.getElementById('pre-img').src=''}
function ins(em){const ta=document.getElementById('post-ta');const s=ta.selectionStart,e=ta.selectionEnd;ta.value=ta.value.slice(0,s)+em+ta.value.slice(e);ta.selectionStart=ta.selectionEnd=s+em.length;ta.focus()}

/* ── POST CRUD ── */
async function submitPost(){
  const ta=document.getElementById('post-ta');const content=ta.value.trim();
  const drawUrl=drawOpen?getDrawUrl():null;
  if(!content&&!pendingImg&&!drawUrl){toast('Write, draw, or add a photo first!');return}
  const btn=document.getElementById('post-btn');btn.disabled=true;btn.textContent='Posting…';
  try{
    await api('posts',{method:'POST',body:{content,imgUrl:pendingImg,drawUrl,monthKey:mkKey()}});
    ta.value='';rmMedia();
    if(drawOpen){clearCv();drawOpen=false;document.getElementById('draw-pn').style.display='none';document.getElementById('draw-btn').classList.remove('on')}
    toast('Posted! 🎉');await loadFeed({keep:true});
  }catch(e){toast(e.message)}
  finally{btn.disabled=false;btn.textContent='Post'}
}

/* Loads the shared feed for the month on screen. */
async function loadFeed(opts){
  opts=opts||{};
  const key=mkKey();const el=document.getElementById('feed');
  if(!opts.silent&&!opts.keep)el.innerHTML='<div style="text-align:center;padding:40px;color:var(--sb)">Loading&hellip;</div>';
  try{
    const d=await api('posts?month='+key);
    if(key!==mkKey()||!me)return;
    const sig=JSON.stringify(d.posts);
    if(opts.silent&&(sig===feedSig||feedBusy()))return;
    feedSig=sig;FEED=d.posts;renderFeed();
  }catch(e){
    if(opts.silent||!me)return;
    el.innerHTML='<div class="empty"><div class="em-ico">⚠️</div><h3>Couldn\'t load the board</h3><p>'+esc(e.message)+'</p></div>';
  }
}
/* Don't redraw the feed under someone who is typing, editing, or reading comments. */
function feedBusy(){
  const f=document.getElementById('feed');const a=document.activeElement;
  if(a&&f.contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName))return true;
  if([].some.call(f.querySelectorAll('.p-ea'),e=>e.style.display==='block'))return true;
  if([].some.call(f.querySelectorAll('[id^="ca-"]'),e=>e.style.display==='block'))return true;
  return !!document.querySelector('.epick');
}
function startPoll(){stopPoll();pollT=setInterval(()=>{if(me&&!document.hidden)loadFeed({silent:true})},30000)}
function stopPoll(){if(pollT){clearInterval(pollT);pollT=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)loadFeed({silent:true})});

function renderFeed(){
  const feed=document.getElementById('feed');
  if(!FEED.length){
    feed.innerHTML='<div class="empty"><div class="em-ico">'+flagify(MO_EM[curMo])+'</div><h3>Nothing posted yet for '+MO[curMo]+'</h3><p>Be the first to share something with the team!</p></div>';
    return;
  }
  feed.innerHTML=FEED.map(p=>postHtml(p)).join('');
}

function postHtml(p){

  for(const[em,cnt]of Object.entries(p.reactions||{})){if(cnt>0){const mine=hasRxn(p.id,em)?'me':'';rxnH+='<button class="rxn '+mine+'" onclick="togRxn(\''+p.id+'\',\''+esc(em)+'\')">'+em+'<span class="rxn-n">'+cnt+'</span></button>'}}
  rxnH+='<button class="add-rxn" onclick="showPick(event,\''+p.id+'\')">+ 😊</button>';
  return '<div class="post-card" id="pc-'+esc(p.id)+'" style="border-left-color:'+bC+'"><div class="pi"><div class="p-hdr">'+avDiv('p-av',p.author,p.avatarUrl)+'<div class="p-meta"><div class="p-who">'+esc(p.author)+'</div><div class="p-ts">'+tAgo(p.ts)+edTag+'</div></div>'+((isOwn||canDel)?'<div class="p-acts">'+(isOwn?'<button class="p-edb" onclick="startEdit(\''+p.id+'\')" title="Edit">✏️</button>':'')+(canDel?'<button class="p-del" onclick="delPost(\''+p.id+'\')" title="Delete">🗑️</button>':'')+'</div>':'')+
  '</div>'+
  (p.content?'<div class="p-cnt" id="pcnt-'+esc(p.id)+'">'+esc(p.content)+'</div>':'<div class="p-cnt" id="pcnt-'+esc(p.id)+'" style="display:none"></div>')+
  '<div class="p-ea" id="pea-'+esc(p.id)+'"><textarea class="p-eta" id="peta-'+esc(p.id)+'">'+esc(p.content||'')+'</textarea><div class="ea-row"><button class="ea-c" onclick="cancelEdit(\''+p.id+'\')">Cancel</button><button class="ea-s" onclick="saveEdit(\''+p.id+'\')">Save Changes</button></div></div>'+
  '</div>'+
  (p.drawUrl?'<div class="p-draw"><img src="'+esc(p.drawUrl)+'" alt="Drawing" loading="lazy"></div>':'')+
  (p.imgUrl?'<div class="p-med"><img src="'+esc(p.imgUrl)+'" alt="Photo" loading="lazy"></div>':'')+
  '<div class="pi" style="padding-top:0"><div class="rxn-bar" id="rxn-'+esc(p.id)+'">'+rxnH+'</div>'+
  '<div class="cw"><button class="tc" onclick="togCmts(\''+p.id+'\')">💬 <span id="cc-'+esc(p.id)+'">'+(p.comments?p.comments.length:0)+'</span> comments</button><div id="ca-'+esc(p.id)+'" style="display:none"></div></div>'+
  '</div></div>';
}

function drawCmts(pid,area){

async function postCmt(pid){

    const d=await api('posts/'+pid+'/comments',{method:'POST',body:{content}});

      +'<button class="auth-btn" type="submit">Log in</button></form>'

      +'<button class="auth-btn" type="submit">Save password</button></form>'
      +'<button class="auth-link" type="button" onclick="authBack()">Back to log in</button>';
  }else if(step==='mfa_setup'){
    t.textContent='Set up two-step verification';
    sub.textContent='Open an authenticator app (Microsoft Authenticator, Google Authenticator, Authy…), scan this code, then type the 6-digit number it shows.';
    body.innerHTML='<div class="qr-box" id="qr-box">Loading&hellip;</div>'
      +'<form onsubmit="authSubmit(event,\'mfa_setup\');return false">'

      +'<button class="auth-btn" type="submit">Turn on &amp; log in</button></form>'
      +'<button class="auth-link" type="button" onclick="authBack()">Back to log in</button>';
    loadQr();
  }else if(step==='mfa_code'){
    t.textContent='Enter your code';
    sub.textContent='Open your authenticator app and type the 6-digit code for TaxAce Community Board.';
    body.innerHTML='<form onsubmit="authSubmit(event,\'mfa_code\');return false">'
      +'<label>6-digit code<input class="code-in" type="text" name="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required></label>'
      +'<button class="auth-btn" type="submit">Verify &amp; log in</button></form>'
      +'<div class="auth-note">Lost your phone? Ask your admin to reset your authenticator.</div>'
      +'<button class="auth-link" type="button" onclick="authBack()">Back to log in</button>';
  }
  const first=body.querySelector('input');if(first)first.focus();
}

async function loadQr(){
  try{
    const d=await api('auth/mfa/setup',{method:'POST'});
    if(authStep!=='mfa_setup')return;
    document.getElementById('qr-box').innerHTML='<img src="'+esc(d.qr)+'" alt="QR code for your authenticator app">'
      +'<div class="qr-hint">Can\'t scan? Enter this key in your app instead:</div><div class="qr-secret">'+esc(d.secret)+'</div>';
  }catch(e){
    if(e.status===401){showAuth('login','Your sign-in timed out. Please log in again.');return}
    const box=document.getElementById('qr-box');if(box)box.textContent='';
    setAuthErr(e.message);
  }
}

async function authSubmit(ev,step){
  ev.preventDefault();
  const f=ev.target;const btn=f.querySelector('button[type=submit]');
  setAuthErr('');btn.disabled=true;
  try{
    if(step==='login'){
      const d=await api('auth/login',{method:'POST',body:{email:fv(f,'email'),password:fv(f,'password')}});
      showAuth(d.next);
    }else if(step==='change_password'){
      if(fv(f,'np')!==fv(f,'np2'))throw new Error('The two passwords do not match.');
      const d=await api('auth/password',{method:'POST',body:{newPassword:fv(f,'np')}});
      showAuth(d.next);
    }else{
      const d=await api(step==='mfa_setup'?'auth/mfa/enable':'auth/mfa/verify',{method:'POST',body:{code:fv(f,'code')}});
      me=d.member;enterBoard();
    }
  }catch(e){
    if(e.status===401&&step!=='login'){showAuth('login','Your sign-in timed out. Please log in again.');return}
    setAuthErr(e.message);
    const code=f.querySelector('.code-in');if(code){code.value='';code.focus()}
    btn.disabled=false;
  }
}
function authBack(){api('auth/logout',{method:'POST'}).catch(()=>{});showAuth('login')}

function enterBoard(){
  document.getElementById('auth').style.display='none';
  document.body.classList.remove('locked');
  applyUser();loadFeed();startPoll();
}

}

  closeAcct();

  me=null;uname='';FEED=[];feedSig='';stopPoll();closeModal();
  document.getElementById('feed').innerHTML='';
  document.getElementById('post-ta').value='';rmMedia();
  showAuth('login');
}

let ADM=[],lastStarter='';
function fmtDate(ts){return ts?new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'Never'}
async function openAdmin(){
  closeAcct();
  openModal('<h3>👥 Manage team</h3><div id="adm-body">Loading&hellip;</div><div class="m-row"><button type="button" class="m-btn alt" onclick="closeModal()">Close</button></div>',true);

function admRow(m){
  const self=!!(me&&m.id===me.id);
  const b=[];
  if(m.role==='admin')b.push('<span class="badge ok">Admin</span>');
  if(!m.active)b.push('<span class="badge bad">Deactivated</span>');
  if(m.locked)b.push('<span class="badge bad">Locked (too many attempts)</span>');
  b.push(m.mfaEnabled?'<span class="badge ok">Authenticator on</span>':'<span class="badge warn">Authenticator not set up</span>');
  if(m.mustChangePassword)b.push('<span class="badge warn">Still on starter password</span>');
  b.push('<span class="badge">Last login: '+esc(fmtDate(m.lastLoginAt))+'</span>');
  const a=[];
  if(!self){
    const id=m.id;
    a.push('<button class="m-btn alt sm" onclick="admAct(\''+id+'\',\'reset-password\')">Reset password</button>');
    a.push('<button class="m-btn alt sm" onclick="admAct(\''+id+'\',\'reset-mfa\')">Reset authenticator</button>');
    a.push('<button class="m-btn alt sm" onclick="admAct(\''+id+'\',\''+(m.role==='admin'?'make-member':'make-admin')+'\')">'+(m.role==='admin'?'Remove admin':'Make admin')+'</button>');
    a.push('<button class="m-btn alt sm" onclick="admAct(\''+id+'\',\''+(m.active?'deactivate':'activate')+'\')">'+(m.active?'Deactivate':'Reactivate')+'</button>');
  }
  return '<div class="adm-it'+(m.active?'':' off')+'"><div><div class="adm-nm">'+esc(m.name)+(self?' (you)':'')+'</div><div class="adm-em">'+esc(m.email)+'</div><div>'+b.join('')+'</div></div><div class="adm-acts">'+a.join('')+'</div></div>';
}
async function renderAdmin(note){
  const body=document.getElementById('adm-body');if(!body)return;
  try{
    const d=await api('admin/members');ADM=d.members;
    let h='';
    if(note){
      lastStarter=note.pw;
      h+='<div class="starter"><b>'+esc(note.title)+'</b><br><code>'+esc(note.pw)+'</code><button type="button" class="m-btn sm" onclick="copyStarter()">Copy</button><br>'
        +'<small>Shown only once. Send it to them privately (not in a group chat). They will choose their own password the first time they log in.</small></div>';
    }
    h+='<form class="adm-add" onsubmit="admAdd(event);return false">'
      +'<label>Name<input name="name" maxlength="60" required placeholder="Full name"></label>'
      +'<label>Email<input name="email" type="email" required placeholder="name@company.com" autocapitalize="none"></label>'
      +'<label>Role<select name="role"><option value="member">Member</option><option value="admin">Admin</option></select></label>'
      +'<button class="m-btn" type="submit">Add person</button></form><div class="auth-err" id="adm-err"></div>';

function copyStarter(){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastStarter).then(()=>toast('Copied ✓'),()=>toast('Could not copy. Select the password and copy it.'));
  }else toast('Select the password and copy it.');
}
async function admAdd(ev){
  ev.preventDefault();const f=ev.target;
  try{
    const d=await api('admin/members',{method:'POST',body:{name:fv(f,'name'),email:fv(f,'email'),role:fv(f,'role')}});
    await renderAdmin({title:'Starter password for '+d.member.name+' ('+d.member.email+')',pw:d.starterPassword});
  }catch(e){const el=document.getElementById('adm-err');if(el)el.textContent=e.message}
}
async function admAct(id,action){
  const m=ADM.find(x=>x.id===id);if(!m)return;
  const ask={
    'reset-password':'Reset the password for '+m.name+'? They will be signed out and will need the new starter password.',
    'reset-mfa':'Reset the authenticator for '+m.name+'? They will be signed out and set up a new one at their next login.',
    'deactivate':'Deactivate '+m.name+'? They will be signed out and unable to log in.',
    'make-admin':'Make '+m.name+' an admin? Admins can add people, reset passwords, and delete any post.',
    'make-member':'Remove admin access for '+m.name+'?'
  };
  if(ask[action]&&!confirm(ask[action]))return;
  try{
    let note=null;
    if(action==='reset-password'){
      const d=await api('admin/members/'+id+'/reset-password',{method:'POST'});
      note={title:'New starter password for '+m.name,pw:d.starterPassword};
    }else if(action==='reset-mfa'){
      await api('admin/members/'+id+'/reset-mfa',{method:'POST'});toast('Authenticator reset for '+m.name+' ✓');
    }else if(action==='deactivate'||action==='activate'){
      await api('admin/members/'+id+'/active',{method:'POST',body:{active:action==='activate'}});
      toast(m.name+(action==='activate'?' reactivated ✓':' deactivated ✓'));
    }else{
      await api('admin/members/'+id+'/role',{method:'POST',body:{role:action==='make-admin'?'admin':'member'}});toast('Role updated ✓');
    }
    await renderAdmin(note);
  }catch(e){toast(e.message)}
}

/* ── PROFILE PHOTO ── */
function pickAvatar(){closeAcct();document.getElementById('av-in').click()}
/* Centre-crops to a square and shrinks to 256x256 so uploads are tiny. */
function squareAvatar(file){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      const S=256,cv=document.createElement('canvas');cv.width=cv.height=S;
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
      const m=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('That file could not be read as a picture. Try a JPG or PNG.'))};
    img.src=url;
  });
}
document.getElementById('av-in').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  if(!/^image\//.test(f.type)){toast('Please choose a picture (JPG or PNG).');return}
  try{
    const dataUrl=await squareAvatar(f);
    const d=await api('me/avatar',{method:'POST',body:{imageUrl:dataUrl}});
    me=d.member;applyUser();toast('Profile photo updated ✓');loadFeed({keep:true});
  }catch(err){toast(err.message)}
});
async function removeAvatar(){
  closeAcct();
  if(!confirm('Remove your profile photo?'))return;
  try{const d=await api('me/avatar',{method:'DELETE'});me=d.member;applyUser();toast('Profile photo removed.');loadFeed({keep:true})}
  catch(e){toast(e.message)}
}

/* ── INIT ── */
async function init(){
  applyMonth();
  try{
    const d=await api('me');
    me=d.member;enterBoard();
  }catch(e){
    showAuth((e.data&&e.data.pending)||'login');
  }
}
init();
</script>
